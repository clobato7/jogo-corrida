name: Publicar jogo (Web)

# Roda a cada push na main e também pode ser disparado à mão na aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guarda o Godot e o template Web entre execuções (evita baixar 1,3 GB toda vez).
      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Baixar Godot e template Web
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V=${GODOT_VERSION}
          BASE=https://github.com/godotengine/godot/releases/download/${V}-stable
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip ${BASE}/Godot_v${V}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${V}-stable_linux.x86_64 godot && rm godot.zip
          curl -sSL -o templates.tpz ${BASE}/Godot_v${V}-stable_export_templates.tpz
          unzip -q templates.tpz templates/web_nothreads_release.zip templates/version.txt
          rm templates.tpz

      - name: Instalar template
        run: |
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          cp ~/godot/templates/* "$T"/

      - name: Exportar
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm && test -f build/web/index.pck
          ls -la build/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
